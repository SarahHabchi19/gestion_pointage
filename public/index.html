<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonatrach — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-cream: #f4e9da;
    --orange: #e2872f;
    --orange-dark: #cf7a26;
    --orange-deep: #b85f1a;
    --text-dark: #2b1a10;
    --text-muted: #8d7c69;
    --border-soft: #e9dcc8;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    font-family: 'Poppins', sans-serif;
    background: var(--bg-cream);
    color: var(--text-dark);
    -webkit-font-smoothing: antialiased;
  }

  .screen{
    display:flex;
    min-height:100vh;
  }

  /* ============ LEFT PANEL (50%) ============ */
  .left{
    position:relative;
    flex: 0 0 50%;
    max-width:50%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    padding: 48px 56px 60px;
    color:#fff;
    background: #a84a15;
  }

  .left-photo{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    object-position: 50% 30%;
    z-index:0;
  }

  .left::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(18,8,2,0.55) 0%, rgba(18,8,2,0.08) 30%, rgba(18,8,2,0.18) 55%, rgba(10,4,1,0.85) 100%);
    z-index:1;
  }

  .brand{ position:relative; z-index:2; display:flex; align-items:center; gap:14px; }
  .brand-logo{
    width:96px; height:139px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55)) drop-shadow(0 0 26px rgba(0,0,0,0.35));
  }
  .brand-logo svg{ width:100%; height:100%; display:block; }
  .brand-name{
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  .left-content{
    position:relative; z-index:2;
    margin-top: auto;
  }
  .left-content h1{
    font-size: 40px;
    font-weight:700;
    margin-bottom: 16px;
    letter-spacing: -0.3px;
    line-height: 1.15;
    text-shadow: 0 3px 18px rgba(0,0,0,0.4);
  }
  .left-content p{
    font-size: 16px;
    line-height:1.6;
    max-width: 360px;
    color: rgba(255,255,255,0.95);
    text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    font-weight: 400;
  }
  .left-content p b{ font-weight:700; }

  /* ============ RIGHT PANEL (50%) ============ */
  .right{
    flex: 0 0 50%;
    max-width:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px;
  }

  .form-wrap{
    width:100%;
    max-width: 420px;
  }

  .eyebrow{
    font-size:14px;
    font-weight:700;
    color: var(--orange-dark);
    margin-bottom: 10px;
  }

  .form-wrap h2{
    font-size: 34px;
    font-weight:700;
    color: var(--text-dark);
    margin-bottom: 16px;
    letter-spacing: -0.3px;
  }

  .form-wrap > p{
    font-size: 15.5px;
    line-height:1.65;
    color: var(--text-muted);
    margin-bottom: 36px;
  }

  .field{ margin-bottom: 22px; }
  .field label{
    display:block;
    font-size:13.5px;
    font-weight:600;
    color: var(--text-dark);
    margin-bottom: 9px;
  }

  .input-group{
    display:flex;
    align-items:stretch;
    background: #faf5ec;
    border: 1px solid var(--border-soft);
    border-radius: 11px;
    overflow:hidden;
    transition: border-color .15s ease;
  }
  .input-group:focus-within{ border-color: var(--orange); }

  .input-group input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-family:'Poppins', sans-serif;
    font-size: 14.5px;
    color: var(--text-dark);
    padding: 15px 16px;
    outline:none;
  }
  .input-group input::placeholder{ color:#b3a58f; }

  .input-icon{
    width: 48px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff;
  }
  .input-icon svg{ width:19px; height:19px; }

  .btn-login{
    width:100%;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color:#fff;
    border:none;
    padding: 17px 18px;
    border-radius: 12px;
    font-family:'Poppins', sans-serif;
    font-weight:600;
    font-size: 15px;
    letter-spacing: 0.2px;
    cursor:pointer;
    box-shadow: 0 10px 22px rgba(226,135,47,0.35);
    transition: transform .15s ease;
  }
  .btn-login:hover{ transform: translateY(-1px); }

  @media (max-width: 860px){
    .screen{ flex-direction:column; }
    .left{ max-width:100%; flex-basis:auto; min-height: 320px; padding: 32px 28px 44px; }
    .right{ max-width:100%; flex-basis:auto; padding: 32px 24px 48px; }
  }
</style>
</head>

      <div class="eyebrow">Bienvenue !</div>
      <h2>Connectez-vous</h2>
      <p>Connectez-vous avec vos identifiants professionnels pour accéder à votre espace sécurisé.</p>

      <form id="loginForm">
        <div class="field">
          <label>Nom d'utilisateur</label>
          <div class="input-group">
            <input id="login" type="text" placeholder="Entrez votre nom d'utilisateur" required autocomplete="username">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
            </div>
          </div>
        </div>

        <div class="field">
          <label>Mot de passe</label>
          <div class="input-group">
            <input id="motDePasse" type="password" placeholder="Entrez votre mot de passe" required autocomplete="current-password">
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-login" id="loginButton">Se connecter</button>
        <p id="loginError" role="alert" style="min-height:20px;color:#b42318;margin:14px 0 0;font-size:13px"></p>
      </form>
    </div>
  </div>

</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('loginButton');
  const error = document.getElementById('loginError');
  error.textContent = '';
  button.disabled = true;
  button.textContent = 'Connexion…';
  try {
    const response = await fetch('../api/login.php', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({login: document.getElementById('login').value, mot_de_passe: document.getElementById('motDePasse').value})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.erreur || 'Connexion impossible.');
    window.location.href = data.utilisateur?.role === 'Administrateur' ? 'admin.html' : 'rapports.html';
  } catch (err) {
    error.textContent = err.message;
  } finally {
    button.disabled = false;
    button.textContent = 'Se connecter';
  }
});
</script>
